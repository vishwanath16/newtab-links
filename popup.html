<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 220px; margin: 0; padding: 14px; }
    label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #bbb; border-radius: 22px; transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #1a73e8; }
    input:checked + .slider:before { transform: translateX(18px); }
    #status { margin-top: 8px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <label>
    <span>Open links in new tab</span>
    <span class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </span>
  </label>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
