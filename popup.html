<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#fff; --fg:#202124; --muted:#666; --line:#e3e5e8; --chip:#f1f3f4; --accent:#1a73e8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#202124; --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --chip:#303134; --accent:#8ab4f8; }
    }
    * { box-sizing: border-box; }
    body { font: 14px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .title { font-weight: 600; }
    .switch { position: relative; width: 40px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #bbb; border-radius: 22px; transition: .2s; cursor: pointer; }
    .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #1a73e8; }
    input:checked + .slider:before { transform: translateX(18px); }
    #body.off { opacity: .45; pointer-events: none; }
    .section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
    .seg { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; }
    .seg button { flex: 1; border: 0; background: transparent; color: var(--fg); padding: 6px 8px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
    .seg button.active { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.25); font-weight: 600; }
    .host { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 120px; overflow-y: auto; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li button { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; }
    li button:hover { color: var(--fg); }
    .empty { font-size: 12px; color: var(--muted); }
    footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); text-align: center; font-size: 12px; }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="row">
    <span class="title">Links in New Tab</span>
    <label class="switch" title="Turn the extension on or off everywhere">
      <input type="checkbox" id="master">
      <span class="slider"></span>
    </label>
  </div>

  <div id="body">
    <div class="section">
      <div class="label">Works on</div>
      <div class="seg">
        <button id="mode-all">All sites</button>
        <button id="mode-selected">Selected sites</button>
      </div>
    </div>

    <div class="section">
      <div class="label">This site</div>
      <div class="row" id="site-row">
        <span class="host" id="host"></span>
        <label class="switch" id="site-switch">
          <input type="checkbox" id="site">
          <span class="slider"></span>
        </label>
      </div>
      <div class="hint" id="site-hint"></div>
    </div>

    <div class="section">
      <div class="label" id="list-label"></div>
      <ul id="list"></ul>
      <div class="empty" id="empty"></div>
    </div>
  </div>

  <footer>
    <a href="https://buymeacoffee.com/vishwanath" target="_blank" rel="noopener noreferrer">☕ Buy me a coffee</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
